name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git libffi-dev libssl-dev zlib1g-dev zip unzip wget curl openjdk-17-jdk
          
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests urllib3

      - name: Setup Flutter
        run: |
          wget -q https://storage.googleapis.com/flutter-infra-release/releases/stable/linux/flutter_linux_3.22.3-stable.tar.xz
          tar xf flutter_linux_3.22.3-stable.tar.xz -C $HOME
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: mobile_python
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: origin-ai-apk
          path: mobile_python/build/apk/*.apk
