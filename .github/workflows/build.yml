name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          if [ -f "mobile_python/requirements.txt" ]; then pip install -r mobile_python/requirements.txt; fi

      - name: Create Flutter App Shell
        run: |
          cd mobile_python
          flet create --template app . || true

      - name: Build APK via Flutter Direct
        run: |
          cd mobile_python
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Origin_AI_App
          path: mobile_python/build/app/outputs/flutter-apk/app-release.apk
