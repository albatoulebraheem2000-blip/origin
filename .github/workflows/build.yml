name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install System Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils ninja-build clang cmake build-essential pkg-config liblldb-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK File
        run: |
          cd mobile_python
          echo "y" | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Origin_AI_App
          path: |
            mobile_python/build/apk/*.apk
            mobile_python/build/app/outputs/flutter-apk/*.apk
